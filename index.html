<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>魔導機関の設計図 〜キャラデザ錬成盤〜</title>
    <style>
        :root {
            /* 魔導スチームパンクのカラー設定 */
            --bg-base: #120d0a;
            --bg-gradient: radial-gradient(circle at 50% 0%, #2b1f1a 0%, #120d0a 100%);
            --container-bg: rgba(33, 24, 20, 0.95);
            --card-bg: rgba(20, 15, 12, 0.8);
            --text-main: #e6d5b8; /* 古い羊皮紙のような色 */
            --text-sub: #a6967c;
            --brass-light: #d4af37; /* 真鍮の輝き */
            --brass-dark: #8c6d23;
            --copper: #b85d33; /* 銅色 */
            --magic-glow: #00ffcc; /* 魔力のシアン発光 */
            --magic-glow-dim: rgba(0, 255, 204, 0.15);
            --border-color: #4a382c;
        }

        body {
            font-family: "YuMincho", "Hiragino Mincho ProN", "Georgia", serif;
            background: var(--bg-gradient);
            background-color: var(--bg-base);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            /* 背景にうっすらと魔法陣や歯車の名残を感じさせる模様 */
            background-image: 
                radial-gradient(circle at center, transparent 30%, rgba(0, 255, 204, 0.02) 70%),
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.2) 10px, rgba(0,0,0,0.2) 20px);
        }

        .container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 500px;
            padding: 35px 25px;
            border-radius: 4px;
            border: 2px solid var(--brass-dark);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.8),
                inset 0 0 20px rgba(0, 0, 0, 0.9),
                0 0 15px var(--magic-glow-dim);
            position: relative;
        }

        /* 枠の四隅のビス（留め金）装飾 */
        .container::before, .container::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }
        .container::before {
            border: 1px solid var(--copper);
            top: 6px; bottom: 6px; left: 6px; right: 6px;
            width: auto; height: auto;
            opacity: 0.5;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--brass-light);
            letter-spacing: 0.1em;
            margin-bottom: 5px;
            font-weight: normal;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
            line-height: 1.4;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--copper);
            letter-spacing: 0.2em;
            margin-bottom: 15px;
        }

        .description {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 30px;
            line-height: 1.6;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 20px;
        }

        .settings {
            background: var(--card-bg);
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .settings-group {
            margin-bottom: 20px;
        }
        .settings-group:last-child {
            margin-bottom: 0;
        }

        .settings-label {
            font-size: 0.9rem;
            color: var(--brass-light);
            margin-bottom: 10px;
            display: block;
            letter-spacing: 0.1em;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            font-size: 0.95rem;
            background-color: #0a0806;
            color: var(--text-main);
            outline: none;
            font-family: "YuMincho", serif;
            transition: all 0.3s;
        }

        select:focus {
            border-color: var(--magic-glow);
            box-shadow: 0 0 10px var(--magic-glow-dim);
            color: var(--magic-glow);
        }

        .radio-group {
            display: flex;
            gap: 25px;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .radio-group input[type="radio"] {
            accent-color: var(--copper);
        }

        .btn-generate {
            display: block;
            width: 100%;
            background: linear-gradient(180deg, #2b1f1a 0%, #120d0a 100%);
            color: var(--brass-light);
            border: 1px solid var(--brass-dark);
            padding: 18px 0;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            margin-bottom: 25px;
            font-family: "YuMincho", "Georgia", serif;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-generate::before {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.2), transparent);
            transition: all 0.5s ease;
        }

        .btn-generate:hover {
            border-color: var(--magic-glow);
            color: var(--magic-glow);
            box-shadow: 0 0 20px var(--magic-glow-dim), inset 0 0 10px var(--magic-glow-dim);
            text-shadow: 0 0 8px var(--magic-glow);
        }
        .btn-generate:hover::before {
            left: 200%;
        }

        .result-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            min-height: 150px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            padding: 40px 0;
        }

        .result-item {
            border-bottom: 1px solid rgba(184, 93, 51, 0.2); /* 銅色の細い線 */
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .result-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-label input[type="checkbox"] {
            accent-color: var(--brass-dark);
        }

        .btn-reroll {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 4px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: "YuMincho", serif;
        }

        .btn-reroll:hover {
            border-color: var(--magic-glow);
            color: var(--magic-glow);
            background: var(--magic-glow-dim);
        }

        .item-value {
            font-size: 1.15rem;
            color: var(--text-main);
            text-align: right;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .color-palette-container {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 12px;
        }

        .color-box {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 6px rgba(0,0,0,0.8);
            transform: rotate(45deg); /* ダイヤ型にして魔法っぽさを演出 */
            margin: 0 4px;
        }

        .btn-copy {
            display: block;
            width: 100%;
            background-color: transparent;
            color: var(--brass-light);
            border: 1px dashed var(--brass-dark);
            padding: 14px 0;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: "YuMincho", serif;
        }

        .btn-copy:hover {
            background: rgba(212, 175, 55, 0.05);
            border-style: solid;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>魔導機関の設計図</h1>
    <div class="subtitle">〜 キャラデザ錬成盤 〜</div>
    <p class="description">
        画材・術式・各種要素を機関に組み込み、<br>
        キャラクターの原案を抽出・錬成します。
    </p>

    <div class="settings">
        <div class="settings-group">
            <span class="settings-label">触媒（画材）</span>
            <select id="artSupply">
                <option value="3色ボールペン（黒・赤・青）">3色ボールペン（黒・赤・青）</option>
                <option value="黒のシャーペン">黒のシャーペン</option>
                <option value="アイビスペイント">アイビスペイント</option>
            </select>
        </div>
        <div class="settings-group">
            <span class="settings-label">錬成対象（カテゴリ）</span>
            <div class="radio-group">
                <label><input type="radio" name="category" value="person" checked> 人型</label>
                <label><input type="radio" name="category" value="motif"> 魔導具（モチーフ）</label>
            </div>
        </div>
    </div>

    <button class="btn-generate" onclick="generate()">機関起動（錬成する）</button>

    <div class="result-container" id="resultContainer">
        <div class="empty-state">未稼働：術式を展開してください</div>
    </div>

    <button class="btn-copy" onclick="copyResult()">抽出結果を記録（コピー）</button>
</div>

    ]
};

// ランダム抽出関数
function getRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

// 単体再抽選用関数
function rerollItem(id, type) {
    let result = "";
    
    if (id === "bangs" || id === "hair") {
        const genderEl = document.getElementById("val_gender");
        const currentGender = genderEl ? genderEl.innerText : "中性";
        
        if (id === "bangs") {
            if (currentGender === "男性") result = getRandom(data.bangsMale);
            else if (currentGender === "女性") result = getRandom(data.bangsFemale);
            else result = getRandom([...data.bangsMale, ...data.bangsFemale]);
        } else {
            if (currentGender === "男性") result = getRandom(data.hairMale);
            else if (currentGender === "女性") result = getRandom(data.hairFemale);
            else result = getRandom([...data.hairMale, ...data.hairFemale]);
        }
    } else {
        result = getRandom(data[id]);
    }

    if (type === "text") {
        document.getElementById(`val_${id}`).innerText = result;
    } else if (type === "color") {
        document.getElementById(`val_${id}`).innerText = result.name;
        const boxContainer = document.getElementById(`colors_${id}`);
        boxContainer.innerHTML = "";
        result.colors.forEach(c => {
            const box = document.createElement("div");
            box.className = "color-box";
            box.style.backgroundColor = c;
            boxContainer.appendChild(box);
        });
    }
}

// メインのガチャ実行関数
function generate() {
    const category = document.querySelector('input[name="category"]:checked').value;
    const layout = layouts[category];
    const container = document.getElementById('resultContainer');
    
    if (container.querySelector('.empty-state') || container.dataset.currentCategory !== category) {
        container.innerHTML = "";
        container.dataset.currentCategory = category;
        
        layout.forEach(item => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
                <div class="item-header">
                    <label class="item-label">
                        <input type="checkbox" id="lock_${item.id}"> 固定 ${item.name}
                    </label>
                    <button class="btn-reroll" onclick="rerollItem('${item.id}', '${item.type}')">再錬成</button>
                </div>
                <div class="item-value" id="val_${item.id}"></div>
                ${item.type === 'color' ? `<div class="color-palette-container" id="colors_${item.id}"></div>` : ''}
            `;
            container.appendChild(div);
        });
    }

    if (category === "person" && !document.getElementById('lock_gender').checked) {
        rerollItem("gender", "text");
    }

    layout.forEach(item => {
        if (category === "person" && item.id === "gender") return; 
        
        const lockCheckbox = document.getElementById(`lock_${item.id}`);
        if (!lockCheckbox.checked) {
            rerollItem(item.id, item.type);
        }
    });
}

// 結果コピー関数
function copyResult() {
    const category = document.querySelector('input[name="category"]:checked').value;
    const layout = layouts[category];
    const artSupply = document.getElementById('artSupply').value;
    const container = document.getElementById('resultContainer');
    
    if (container.querySelector('.empty-state')) {
        alert("未稼働です。まずは術式を展開（ガチャを回す）してください！");
        return;
    }

    let copyText = `🔮 魔導機関の設計図\n【触媒】${artSupply}\n\n`;
    
    layout.forEach(item => {
        const val = document.getElementById(`val_${item.id}`).innerText;
        copyText += `【${item.name}】${val}\n`;
    });

    copyText += `\n#キャラデザ錬成盤 #お題ガチャ`;

    navigator.clipboard.writeText(copyText).then(() => {
        alert("抽出結果をクリップボードに記録しました。SNS等へ出力可能です。");
    }).catch(err => {
        alert("記録に失敗しました。手動でコピーをお願いします。");
    });
}

// カテゴリ変更時に表示をリセットする
document.querySelectorAll('input[name="category"]').forEach(radio => {
    radio.addEventListener('change', () => {
        document.getElementById('resultContainer').innerHTML = '<div class="empty-state">未稼働：術式を展開してください</div>';
        document.getElementById('resultContainer').dataset.currentCategory = "";
    });
});
